<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            font-family: "Georgia", serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
        }

        .header {
            margin-top: 40px;
        }

        .header h1 {
            margin: 0;
            font-size: 2.2em;
            font-weight: normal;
        }

        .header p {
            margin: 10px 0 0 0;
            font-size: 1em;
            font-weight: normal;
        }

        .center-link {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .trailer-link, .otras-link {
            font-size: 1.3em;
            text-decoration: underline;
            cursor: pointer;
        }

        /* Pantalla de cine */
        .cinema-player {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .cinema-player iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Panel minimalista pantalla completa */
        .panel {
            display: none; /* Cerrado al iniciar */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            color: white;
            font-family: "Georgia", serif;
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .panel h2 {
            margin: 0 0 20px 0;
            font-size: 2em;
            font-weight: normal;
        }

        .panel a {
            font-size: 1.5em;
            color: white;
            text-decoration: underline;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 1.5em;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Encabezado -->
    <div class="header">
        <h1>DreamDeath</h1>
        <p>Esta película sigue en producción, actualmente con el 50% hecho</p>
    </div>

    <!-- Links al centro -->
    <div class="center-link">
        <span class="trailer-link" onclick="openCinema()">Ver trailer</span>
        <span class="otras-link" onclick="openPanel()">Otras películas</span>
    </div>

    <!-- Reproductor estilo cine -->
    <div class="cinema-player" id="cinemaPlayer">
        <iframe id="youtubePlayer" src="" allowfullscreen></iframe>
    </div>

    <!-- Panel minimalista pantalla completa -->
    <div class="panel" id="panel">
        <span class="close-btn" onclick="closePanel()">✕</span>
        <h2>Otras peliculas</h2>
        <a href="https://marcossunglasses.github.io/Archivos/TobogAnthony.html">TobogAnthony</a>
    </div>

    <script>
        function openCinema() {
            const player = document.getElementById("youtubePlayer");
            document.getElementById("cinemaPlayer").style.display = "flex";
            player.src = "https://www.youtube.com/embed/grGt7rPu1I0?autoplay=1";
        }

        function openPanel() {
            document.getElementById("panel").style.display = "flex";
        }

        function closePanel() {
            document.getElementById("panel").style.display = "none";
        }
    </script>

</body>
</html>
