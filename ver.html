<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: black;
            color: white;
            font-family: "Georgia", serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
        }

        .header {
            margin-top: 40px;
        }

        .header h1 {
            margin: 0;
            font-size: 2.2em;
            font-weight: normal;
        }

        .header p {
            margin: 10px 0 0 0;
            font-size: 1em;
            font-weight: normal;
        }

        .center-link {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }

        .trailer-link,
        .movie-link,
        .otras-link {
            font-size: 1.3em;
            text-decoration: underline;
            cursor: pointer;
        }

        /* Pantalla de cine */
        .cinema-player {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .cinema-player iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Panel minimalista pantalla completa */
        .panel {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            color: white;
            font-family: "Georgia", serif;
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .panel h2 {
            margin: 0 0 20px 0;
            font-size: 2em;
            font-weight: normal;
        }

        .panel a {
            display: block;
            margin: 12px 0;
            font-size: 1.5em;
            color: white;
            text-decoration: underline;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
            font-size: 1.5em;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Encabezado -->
    <div class="header">
        <h1>DreamDeath</h1>
        <p>Puedes ver la película en esta pagina.</p>
    </div>

    <!-- Links al centro -->
    <div class="center-link">
        <span class="trailer-link" onclick="openVideo('https://www.youtube.com/embed/grGt7rPu1I0?autoplay=1')">
            Ver trailer
        </span>

        <span class="movie-link" onclick="openVideo('https://www.youtube.com/embed/Q4IUOlAGbBg?autoplay=1')">
            Ver película
        </span>

        <span class="otras-link" onclick="openPanel()">
            Otras películas
        </span>
    </div>

    <!-- Reproductor estilo cine -->
    <div class="cinema-player" id="cinemaPlayer">
        <iframe
            id="youtubePlayer"
            src=""
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>
    </div>

    <!-- Panel minimalista pantalla completa -->
    <div class="panel" id="panel">
        <span class="close-btn" onclick="closePanel()">✕</span>

        <h2>Otras peliculas</h2>

        <a href="https://marcossunglasses.github.io/proyectos/toboganthony.html">
            TobogAnthony
        </a>

        <a href="#" onclick="openVideo('https://www.youtube.com/embed/OMKaJBscxvs?autoplay=1'); return false;">
            An empty farewell after the end of the absolute in a relative reality of time
        </a>

        <a href="#" onclick="openVideo('https://www.youtube.com/embed/ksOrwx3pB0U?autoplay=1'); return false;">
            Creacion inspiradora
        </a>
    </div>

    <script>
        function openVideo(url) {
            document.getElementById("panel").style.display = "none";
            document.getElementById("cinemaPlayer").style.display = "flex";
            document.getElementById("youtubePlayer").src = url;
        }

        function openPanel() {
            document.getElementById("panel").style.display = "flex";
        }

        function closePanel() {
            document.getElementById("panel").style.display = "none";
        }
    </script>

</body>
</html>
